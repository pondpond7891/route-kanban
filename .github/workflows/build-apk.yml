name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/

      - name: Add Android platform
        run: npx cap add android

      - name: Add location permissions
        run: |
          F=android/app/src/main/AndroidManifest.xml
          P=android.permission
          A='<uses-permission android:name="'
          sed -i "s#</manifest>#$A$P.ACCESS_FINE_LOCATION\"/></manifest>#" $F
          sed -i "s#</manifest>#$A$P.ACCESS_COARSE_LOCATION\"/></manifest>#" $F

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RouteKanban-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
