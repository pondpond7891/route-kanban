<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="google" content="notranslate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Route Kanban</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb;--col:#e8edf3}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--surface:#162033;--text:#e5e7eb;--muted:#94a3b8;--line:#263449;--col:#101a2c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--primary);color:#fff}
header h1{font-size:17px;margin:0}
header button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;font-size:18px;padding:6px 10px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{background:var(--surface);padding:12px 14px;border-bottom:1px solid var(--line)}
.field{display:flex;gap:8px;margin-bottom:8px}
input,select{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--text)}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--primary);color:#fff}
.btn.alt{background:var(--line);color:var(--text)}
.btn.full{width:100%}
#map{height:260px;background:#cbd5e1}
#status{padding:8px 14px;font-size:13px;color:var(--muted)}
#status.err{color:#dc2626}
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 14px 20px;-webkit-overflow-scrolling:touch}
.column{flex:0 0 82%;scroll-snap-align:center;background:var(--col);border-radius:12px;overflow:hidden}
.col-head{padding:10px 12px;color:#fff;font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.col-body{padding:10px;min-height:120px}
.card{background:var(--surface);border-radius:10px;padding:12px;margin-bottom:10px;border-left:6px solid #888;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card.sel{outline:2px solid var(--primary)}
.card h4{margin:0 0 6px;font-size:15px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--line);margin:0 4px 6px 0}
.row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.row span{color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 0}
.dots{display:flex;justify-content:center;gap:6px;margin-top:-8px;padding-bottom:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--primary)}
#settings{display:none}
#settings.open{display:block}
label{font-size:12px;color:var(--muted);display:block;margin:6px 0 3px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<header>
  <h1>🚚 Route Kanban</h1>
  <div><button id="btnInstall" style="display:none;margin-right:6px">⬇️ ติดตั้ง</button><button id="btnSettings" aria-label="ตั้งค่า">⚙️</button></div>
</header>

<main>
  <div id="settings" class="panel">
    <label>ประเภทรถ</label>
    <select id="vehicle"></select>
    <label>อัตราสิ้นเปลือง (กม./ลิตร)</label>
    <input id="kmpl" type="number" step="0.5" min="1">
    <label>ราคาน้ำมัน (บาท/ลิตร)</label>
    <input id="price" type="number" step="0.5" min="1">
    <button class="btn full" id="btnSave" style="margin-top:10px">บันทึก</button>
    <p class="hint">ใช้ OpenStreetMap + OSRM ฟรี ไม่ต้องมี API Key · เวลาเดินทางคำนวณจากความเร็วถนนทั่วไป (ไม่รวมรถติดแบบเรียลไทม์) · ค่าน้ำมันเป็นการประมาณ</p>
  </div>

  <div class="panel">
    <div class="field">
      <input id="origin" placeholder="ต้นทาง" autocomplete="off">
      <button class="btn alt" id="btnGps" aria-label="ใช้ตำแหน่งปัจจุบัน">📍</button>
    </div>
    <div class="field">
      <input id="dest" placeholder="ปลายทาง" autocomplete="off">
    </div>
    <button class="btn full" id="btnSearch">🔍 ค้นหาเส้นทาง</button>
  </div>

  <div id="map"></div>
  <div id="status">กรอกต้นทางและปลายทาง หรือกด 📍 เพื่อใช้ตำแหน่งปัจจุบัน</div>

  <div id="board" class="board"></div>
  <div id="dots" class="dots"></div>
</main>

<script>
const VEHICLES = {
  "🚗 รถเก๋ง":14, "🛻 กระบะ":11, "🚐 รถตู้":9,
  "🚚 รถบรรทุก 6 ล้อ":6, "🚛 รถเทรลเลอร์":3.5, "🏍️ มอเตอร์ไซค์":35
};
const COLORS = ["#2563eb","#16a34a","#f59e0b","#dc2626","#7c3aed"];
const $ = id => document.getElementById(id);

let cfg = JSON.parse(localStorage.getItem("rk_cfg") || "{}");
cfg = Object.assign({vehicle:"🚗 รถเก๋ง", kmpl:14, price:38}, cfg);
let originCoords = null;
let routes = [], selected = 0, lines = [], markers = [];

/* ---------- ตั้งค่า ---------- */
Object.keys(VEHICLES).forEach(v => $("vehicle").add(new Option(v, v)));
$("vehicle").value = cfg.vehicle; $("kmpl").value = cfg.kmpl; $("price").value = cfg.price;
$("vehicle").onchange = () => { $("kmpl").value = VEHICLES[$("vehicle").value]; };
$("btnSettings").onclick = () => $("settings").classList.toggle("open");
$("btnSave").onclick = () => {
  cfg = {vehicle:$("vehicle").value, kmpl:+$("kmpl").value||14, price:+$("price").value||38};
  localStorage.setItem("rk_cfg", JSON.stringify(cfg));
  $("settings").classList.remove("open"); setStatus("บันทึกแล้ว ✔");
};
function setStatus(t, err){ $("status").textContent = t; $("status").className = err ? "err" : ""; }

/* ---------- แผนที่ OpenStreetMap ---------- */
const map = L.map("map", {zoomControl:true}).setView([13.7563,100.5018], 6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);

/* ---------- ตำแหน่งปัจจุบัน ---------- */
$("btnGps").onclick = () => {
  if (!navigator.geolocation) return setStatus("อุปกรณ์ไม่รองรับ GPS", true);
  setStatus("กำลังหาตำแหน่งปัจจุบัน…");
  navigator.geolocation.getCurrentPosition(p => {
    originCoords = {lat:p.coords.latitude, lng:p.coords.longitude};
    $("origin").value = "📍 ตำแหน่งปัจจุบัน";
    map.setView([originCoords.lat, originCoords.lng], 13);
    setStatus(`ได้ตำแหน่งแล้ว (${originCoords.lat.toFixed(4)}, ${originCoords.lng.toFixed(4)})`);
  }, () => setStatus("ขอตำแหน่งไม่สำเร็จ: กรุณาอนุญาต Location", true),
  {enableHighAccuracy:true, timeout:15000});
};
$("origin").addEventListener("input", () => { originCoords = null; });

/* ---------- ค้นหาพิกัดจากชื่อ (Nominatim, ฟรี) ---------- */
async function geocode(q){
  const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=th&q=" + encodeURIComponent(q));
  const j = await r.json();
  if (!j.length) throw new Error(`ไม่พบสถานที่ "${q}"`);
  return {lat:+j[0].lat, lng:+j[0].lon};
}

/* ---------- คำนวณ ---------- */
function fuelEstimate(km, min, kmpl){
  const v = km / Math.max(min/60, 0.01);
  const f = v < 25 ? 1.4 : v < 45 ? 1.15 : v <= 90 ? 1 : 1.15;
  return km / kmpl * f;
}
const fmtTime = m => { m = Math.round(m); const h = Math.floor(m/60); return h ? `${h} ชม. ${m%60} นาที` : `${m} นาที`; };

async function search(){
  const o = $("origin").value.trim(), d = $("dest").value.trim();
  if (!o || !d) return setStatus("กรุณาระบุต้นทางและปลายทาง", true);
  setStatus("กำลังค้นหาเส้นทาง…");
  try {
    const A = originCoords || await geocode(o);
    const B = await geocode(d);
    const url = `https://router.project-osrm.org/route/v1/driving/${A.lng},${A.lat};${B.lng},${B.lat}?alternatives=true&overview=full&geometries=geojson&steps=false`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.code !== "Ok" || !data.routes?.length) throw new Error("ไม่พบเส้นทางระหว่างสองจุดนี้");

    routes = data.routes.map((r,i) => {
      const km = r.distance/1000, min = r.duration/60;
      const fuel = fuelEstimate(km, min, cfg.kmpl);
      return {idx:i, name:`เส้นทาง ${i+1}`, km, min, fuel, cost:fuel*cfg.price,
              path:r.geometry.coordinates.map(c => [c[1], c[0]])};
    });
    selected = 0;
    setStatus(`พบ ${routes.length} เส้นทาง · แตะการ์ดเพื่อดูบนแผนที่`);
    render(); drawMap(true);
    $("map").scrollIntoView({behavior:"smooth", block:"start"});
  } catch (e) { setStatus("ผิดพลาด: " + e.message, true); }
}
$("btnSearch").onclick = search;

/* ---------- Kanban ---------- */
function card(r, badges){
  return `<div class="card ${r.idx===selected?"sel":""}" style="border-left-color:${COLORS[r.idx%5]}" data-i="${r.idx}">
    <h4>🛣️ ${r.name}</h4>${badges.map(b=>`<span class="tag">${b}</span>`).join("")}
    <div class="row"><span>📏 ระยะทาง</span><b>${r.km.toFixed(1)} กม.</b></div>
    <div class="row"><span>⏱️ เวลา</span><b>${fmtTime(r.min)}</b></div>
    <div class="row"><span>⛽ น้ำมัน</span><b>${r.fuel.toFixed(2)} ลิตร</b></div>
    <div class="row"><span>💰 ค่าน้ำมัน</span><b>${Math.round(r.cost)} บาท</b></div></div>`;
}
function render(){
  const best = f => routes.reduce((a,b) => f(b) < f(a) ? b : a);
  const fast = best(r=>r.min), short = best(r=>r.km), eco = best(r=>r.fuel);
  const badges = {};
  routes.forEach(r => badges[r.idx] = []);
  badges[fast.idx].push("⚡ เร็วที่สุด"); badges[short.idx].push("📏 สั้นที่สุด"); badges[eco.idx].push("⛽ ประหยัดที่สุด");
  const cols = [
    ["📋 ทุกเส้นทาง","#475569",routes],
    ["⚡ เร็วที่สุด","#2563eb",[fast]],
    ["📏 สั้นที่สุด","#16a34a",[short]],
    ["⛽ ประหยัดน้ำมัน","#f59e0b",[eco]]
  ];
  $("board").innerHTML = cols.map(([t,c,list]) =>
    `<section class="column"><div class="col-head" style="background:${c}"><span>${t}</span><span>${list.length}</span></div>
     <div class="col-body">${list.map(r=>card(r,badges[r.idx])).join("") || '<div class="empty">— ไม่มี —</div>'}</div></section>`).join("");
  $("dots").innerHTML = cols.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("");
  document.querySelectorAll(".card").forEach(el => el.onclick = () => { selected = +el.dataset.i; render(); drawMap(false); });
  $("board").onscroll = () => {
    const i = Math.round($("board").scrollLeft / ($("board").scrollWidth / cols.length));
    document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on", k===i));
  };
}

/* ---------- วาดเส้นทาง ---------- */
function drawMap(fit){
  lines.forEach(l=>map.removeLayer(l)); markers.forEach(m=>map.removeLayer(m)); lines=[]; markers=[];
  [...routes].sort((a,b)=>(a.idx===selected)-(b.idx===selected)).forEach(r => {
    const sel = r.idx === selected;
    lines.push(L.polyline(r.path, {color:COLORS[r.idx%5], opacity: sel?1:.4, weight: sel?7:4}).addTo(map));
  });
  const p = routes[0].path;
  markers.push(L.marker(p[0]).bindTooltip("ต้นทาง").addTo(map));
  markers.push(L.marker(p[p.length-1]).bindTooltip("ปลายทาง").addTo(map));
  if (fit) map.fitBounds(L.latLngBounds(routes.flatMap(r => r.path)), {padding:[24,24]});
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e; $("btnInstall").style.display = "inline-block";
});
$("btnInstall").onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt = null; $("btnInstall").style.display = "none";
};
window.addEventListener("appinstalled", () => setStatus("ติดตั้งแอปแล้ว ✔"));

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
